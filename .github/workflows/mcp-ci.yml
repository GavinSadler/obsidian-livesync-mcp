name: MCP Server CI

on:
  push:
    branches:
      - main
      - claude/**
    paths:
      - 'mcp_server/**'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'mcp_server/**'
      - '.github/workflows/mcp-ci.yml'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: cd mcp_server && uv sync

      - name: Check formatting
        run: cd mcp_server && uv run ruff format --check .

      - name: Lint
        run: cd mcp_server && uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: cd mcp_server && uv sync

      - name: Type check
        run: cd mcp_server && uv run mypy src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: cd mcp_server && uv sync

      - name: Run tests
        run: cd mcp_server && uv run pytest --cov=src --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./mcp_server
          fail_ci_if_error: false
